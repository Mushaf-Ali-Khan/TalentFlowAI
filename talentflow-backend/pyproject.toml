[project]
name = "talentflow-backend"
version = "0.1.0"
description = "TalentFlow AI Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn>=0.30.0",
    "langgraph==0.3.21",
    "langchain-anthropic==0.3.10",
    "anthropic>=0.43.0",
    "celery==5.4.0",
    "redis==5.2.1",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "pgvector==0.3.6",
    "pydantic==2.10.4",
    "pydantic-settings>=2.0.0",
    "alembic==1.14.0",
    "pdfplumber==0.11.4",
    "pymupdf==1.25.1",
    "python-docx==1.1.2",
    "sentence-transformers==3.3.1",
    "circuitbreaker==2.0.0",
    "python-magic==0.4.27",
    "clerk-backend-api==1.7.0",
    "logfire==2.7.0",
    "sentry-sdk==2.19.2",
    "python-multipart>=0.0.9",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'", # for Windows
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
